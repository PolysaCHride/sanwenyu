name: sanwenyu
description: "三文于 - 韩剧聚合播放客户端"
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  dio: ^5.11.1
  cookie_jar: ^4.0.9
  html: ^0.15.7
  sqlite3: ^3.7.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  cached_network_image: ^4.0.4
  logger: ^2.8.0
  intl: ^0.20.3
  collection: ^1.19.1
  uuid: ^4.6.0

# shared_preferences_android 2.5.x 在当前 Kotlin/AGP 组合下运行时报
# SharedPreferencesApiRegistrar.getAll 方法签名不匹配；固定到旧版通道实现。
dependency_overrides:
  shared_preferences_android: 2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/rules/
